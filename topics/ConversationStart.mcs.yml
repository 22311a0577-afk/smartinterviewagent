mcs.metadata:
  componentName: Conversation Start
  description: This system topic triggers when the agent receives an Activity indicating the beginning of a new conversation. If you do not want the agent to initiate the conversation, disable this topic.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - |-
            Hello, I'm {System.Bot.Name}.
            I can run a technical mock interview and score each answer.

            Try one of these:
            - "Start interview"
            - "Practice frontend"
            - "Ask a DBMS question"
        speak:
          - Hello, I am {System.Bot.Name}. I can run a technical mock interview and score each answer. Say start interview to begin.