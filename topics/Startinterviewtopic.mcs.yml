mcs.metadata:
  componentName: Start interview topic
kind: AdaptiveDialog
modelDescription: Use this topic when the user asks to start an interview, practice interview questions, or test their knowledge in any technical domain.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: Question
      id: question_KOIetb
      interruptionPolicy:
        allowInterruption: true

      variable: init:Global.usertopic
      prompt: Choose an interview track: Backend, Frontend, DBMS, or Power Platform.
      entity:
        kind: ClosedListEntityReference
        entityId: cr994_agent.entity.TopicEntity

    - kind: InvokeFlowAction
      id: invokeFlowAction_geJm2T
      input:
        binding:
          number: 0
          text: InterviewStarted
          text_1: =System.User.Email
          text_2: =Text(Global.usertopic)
          text_4: "\"Started\""

      output: {}
      flowId: 4ee961ed-1837-f111-88b3-7ced8d71b78c

    - kind: SetMultipleVariables
      id: setVariable_pnabt6
      assignments:
        - variable: Global.difficulty
          value: Easy

        - variable: Global.questioncount
          value: 0

        - variable: Global.totalscore
          value: 0

        - variable: Global.interviewsummary
          value: =Text("")

        - variable: Global.askedquestions
          value: =Text("")

        - variable: Global.duplicateregeneratecount
          value: 0
        

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_n9GM6W
      input:
        binding:
          difficulty: =Text(Global.difficulty)
          interview_20summary: =Text(Global.interviewsummary)
          usertopic: |
            =Text(Global.usertopic)

      output:
        binding:
          predictionOutput: Topic.Question

      aIModelId: 6c627dc1-71ff-48e4-ba0f-5b10d33855e7

    - kind: ConditionGroup
      id: conditionGroup_nonrepeat
      conditions:
        - id: conditionItem_nonrepeat_1
          condition: =!IsBlank(Global.askedquestions) && (Lower(Topic.Question.text) in Lower(Global.askedquestions)) && Global.duplicateregeneratecount < 2
          actions:
            - kind: SetVariable
              id: setVariable_nonrepeatcounter
              variable: Global.duplicateregeneratecount
              value: =Global.duplicateregeneratecount + 1

            - kind: SendActivity
              id: sendActivity_nonrepeat
              activity: I generated a duplicate question. Let me pick a different one.

            - kind: GotoAction
              id: gotoAction_nonrepeat
              actionId: invokeAIBuilderModelAction_n9GM6W

    - kind: SetVariable
      id: setVariable_trackasked
      variable: Global.askedquestions
      value: =Global.askedquestions & "||" & Topic.Question.text

    - kind: InvokeFlowAction
      id: invokeFlowAction_pYlu6v
      input:
        binding:
          number: =Global.totalscore
          text: QuestionAsked
          text_1: =System.User.Email
          text_2: =Text(Global.usertopic)
          text_4: Asked

      output: {}
      flowId: 4ee961ed-1837-f111-88b3-7ced8d71b78c

    - kind: Question
      id: question_VrT22D
      interruptionPolicy:
        allowInterruption: false

      variable: init:Topic.useranswer
      prompt: |-
        {Topic.Question.text}
        Your answer (be concise and technical).
        Commands: type "help" for commands, "skip" to move to next question, "retry" to answer this question again, or "stop" to end interview.
      entity: StringPrebuiltEntity

    - kind: SetVariable
      id: setVariable_usercommand
      variable: Topic.usercommand
      value: =Lower(Trim(Topic.useranswer))

    - kind: ConditionGroup
      id: conditionGroup_usercommands
      conditions:
        - id: conditionItem_cmd_stop
          condition: =Topic.usercommand = "stop" || Topic.usercommand = "quit" || Topic.usercommand = "end"
          actions:
            - kind: SendActivity
              id: sendActivity_cmd_stop
              activity: Interview stopped. Here is your summary so far.

            - kind: GotoAction
              id: gotoAction_cmd_stop
              actionId: sendActivity_LoeMtx

        - id: conditionItem_cmd_retry
          condition: =Topic.usercommand = "retry" || Topic.usercommand = "repeat"
          actions:
            - kind: SendActivity
              id: sendActivity_cmd_retry
              activity: Re-asking the same question.

            - kind: GotoAction
              id: gotoAction_cmd_retry
              actionId: question_VrT22D

        - id: conditionItem_cmd_skip
          condition: =Topic.usercommand = "skip"
          actions:
            - kind: SetMultipleVariables
              id: setVariable_cmd_skip
              assignments:
                - variable: Topic.useranswer
                  value: ="[Skipped by user]"

                - variable: Topic.scoreperquestion
                  value: 0

                - variable: Topic.feedback
                  value: ="Question skipped by user."

            - kind: SendActivity
              id: sendActivity_cmd_skip
              activity: Skipped. Moving to the next question.

            - kind: GotoAction
              id: gotoAction_cmd_skip
              actionId: setVariable_Cg3tnh

    - kind: SetMultipleVariables
      id: setVariable_nPPTQV
      assignments:
        - variable: Topic.scoreperquestion
          value: 0

        - variable: Topic.feedback
          value: =""

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_CqU6rW
      input:
        binding:
          CurrentQuestion: =Topic.Question.text
          feedback: =Topic.feedback
          score: =Text(Topic.scoreperquestion)
          useranswer: =Topic.useranswer

      output:
        binding:
          predictionOutput: Topic.Evaluatedanswer

      aIModelId: cd19e6fc-6849-481c-ae75-774e4513591d

    - kind: SendActivity
      id: sendActivity_aUxZIk
      activity: "{Topic.Evaluatedanswer.text}"

    - kind: SetVariable
      id: setVariable_uA57hP
      variable: Topic.feedback
      value: =Topic.Evaluatedanswer.text

    - kind: ConditionGroup
      id: conditionGroup_scoremapping
      conditions:
        - id: conditionItem_score_10
          condition: =("score: 10/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 10/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 10/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_10
              variable: Topic.scoreperquestion
              value: 10

        - id: conditionItem_score_9
          condition: =("score: 9/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 9/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 9/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_9
              variable: Topic.scoreperquestion
              value: 9

        - id: conditionItem_score_8
          condition: =("score: 8/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 8/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 8/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_8
              variable: Topic.scoreperquestion
              value: 8

        - id: conditionItem_score_7
          condition: =("score: 7/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 7/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 7/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_7
              variable: Topic.scoreperquestion
              value: 7

        - id: conditionItem_score_6
          condition: =("score: 6/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 6/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 6/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_6
              variable: Topic.scoreperquestion
              value: 6

        - id: conditionItem_score_5
          condition: =("score: 5/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 5/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 5/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_5
              variable: Topic.scoreperquestion
              value: 5

        - id: conditionItem_score_4
          condition: =("score: 4/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 4/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 4/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_4
              variable: Topic.scoreperquestion
              value: 4

        - id: conditionItem_score_3
          condition: =("score: 3/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 3/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 3/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_3
              variable: Topic.scoreperquestion
              value: 3

        - id: conditionItem_score_2
          condition: =("score: 2/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 2/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 2/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_2
              variable: Topic.scoreperquestion
              value: 2

        - id: conditionItem_score_1
          condition: =("score: 1/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 1/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 1/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_1
              variable: Topic.scoreperquestion
              value: 1

        - id: conditionItem_score_0
          condition: =("score: 0/10" in Lower(Topic.Evaluatedanswer.text)) || ("score 0/10" in Lower(Topic.Evaluatedanswer.text)) || ("score - 0/10" in Lower(Topic.Evaluatedanswer.text))
          actions:
            - kind: SetVariable
              id: setVariable_score_0
              variable: Topic.scoreperquestion
              value: 0

      elseActions:
        - kind: SetVariable
          id: setVariable_score_default
          variable: Topic.scoreperquestion
          value: 0

        - kind: SetVariable
          id: setVariable_score_default_feedback
          variable: Topic.feedback
          value: =Topic.feedback & "\nScore parse fallback used: 0/10."

    - kind: InvokeFlowAction
      id: invokeFlowAction_VDY9Gm
      input:
        binding:
          number: =Global.totalscore
          text: AnswerEvaluated
          text_1: =System.User.Email
          text_2: |
            =Text(Global.usertopic)
          text_4: Evaluated

      output: {}
      flowId: 4ee961ed-1837-f111-88b3-7ced8d71b78c

    - kind: SetMultipleVariables
      id: setVariable_Cg3tnh
      assignments:
        - variable: Global.totalscore
          value: =Global.totalscore + Topic.scoreperquestion

        - variable: Global.interviewsummary
          value: |-
            =Global.interviewsummary &
            "Q: " & Topic.Question.text &
            "\nA: " & Topic.useranswer &
            "\nScore: " & Topic.scoreperquestion &
            "\nFeedback: " & Topic.feedback & "\n\n"

    - kind: ConditionGroup
      id: conditionGroup_xqiCMI
      conditions:
        - id: conditionItem_OeDTx0
          condition: =Topic.scoreperquestion >= 8
          actions:
            - kind: SetVariable
              id: setVariable_rIq1FF
              variable: Global.difficulty
              value: Hard

        - id: conditionItem_gE6BWJ
          condition: =Topic.scoreperquestion >= 5
          actions:
            - kind: SetVariable
              id: setVariable_oZ2XAW
              variable: Global.difficulty
              value: Medium

      elseActions:
        - kind: SetVariable
          id: setVariable_BpC66K
          variable: Global.difficulty
          value: Easy

    - kind: SetVariable
      id: setVariable_M44s9R
      variable: Global.questioncount
      value: =Global.questioncount+1

    - kind: ConditionGroup
      id: conditionGroup_ogj300
      conditions:
        - id: conditionItem_tNeD3O
          condition: =Global.questioncount < 5
          actions:
            - kind: SetVariable
              id: setVariable_resetduplicateregeneratecount
              variable: Global.duplicateregeneratecount
              value: 0

            - kind: GotoAction
              id: U3gWSy
              actionId: invokeAIBuilderModelAction_n9GM6W

      elseActions:
        - kind: SendActivity
          id: sendActivity_LoeMtx
          activity:
            attachments:
              - kind: AdaptiveCardTemplate
                cardContent: |-
                  {
                    "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.5",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "🎉 Interview Completed",
                        "weight": "Bolder",
                        "size": "Large",
                        "color": "Good"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Thank you for attempting the interview.",
                        "wrap": true,
                        "spacing": "Medium"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Your responses have been evaluated successfully.",
                        "wrap": true,
                        "spacing": "Small"
                      },
                      {
                        "type": "TextBlock",
                        "text": "📧 A detailed report has been sent to your registered email.",
                        "wrap": true,
                        "spacing": "Small"
                      }
                    ]
                  }

        - kind: SetVariable
          id: setVariable_A9JeWk
          variable: Topic.avgscore
          value: =If(Global.questioncount = 0, 0, Global.totalscore/Global.questioncount)

        - kind: InvokeFlowAction
          id: invokeFlowAction_L4WEjU
          input:
            binding:
              number: =Topic.avgscore
              text: =System.User.Email
              text_1: =Global.interviewsummary
              text_2: =Text(Global.usertopic)

          output: {}
          flowId: 255264fd-e236-f111-88b4-7ced8d75a980

        - kind: InvokeFlowAction
          id: invokeFlowAction_2uT8s8
          input:
            binding:
              number: =Global.totalscore
              text: InterviewCompleted
              text_1: =System.User.Email
              text_2: =Text(Global.usertopic)
              text_4: completed

          output: {}
          flowId: 4ee961ed-1837-f111-88b3-7ced8d71b78c

    - kind: EndConversation
      id: ADVfff

inputType: {}
outputType: {}