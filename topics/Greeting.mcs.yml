mcs.metadata:
  componentName: Greeting
  description: This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - |-
            Hello. I can help you practice interviews in Backend, Frontend, DBMS, or Power Platform.
            Say "Start interview" to begin.
        speak:
          - Hello. I can help you practice interviews. Say start interview to begin.

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22