mcs.metadata:
  componentName: Fallback
  description: This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -2
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: |-
                I can help with interview practice and technical Q&A.
                Try one of these:
                - Start interview
                - Help
                - Ask a Backend question
                - Ask a Frontend question
                - Ask a DBMS question
                - Ask a Power Platform question

      elseActions:
        - kind: SendActivity
          id: sendMessage_QZreqo_2
          activity: |-
            I still couldn't match that request.
            You can type:
            - Start interview
            - Help
            - Start over
            - Backend / Frontend / DBMS / Power Platform question